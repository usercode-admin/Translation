name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "0.35.2"

      - name: Install ESP32 Board Core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install Dependencies
        run: |
          arduino-cli lib install LovyanGFX
          arduino-cli lib install "ESP32 camera"

      - name: Compile Code
        run: |
          # Dùng -v (verbose) để nó in ra tất cả mọi thứ nó đang làm
          arduino-cli compile -v --fqbn esp32:esp32:esp32s3:MCU=esp32s3,PartitionScheme=huge_app,PSRAM=opi --output-dir ./build "./night cam"

      - name: Check files
        run: ls -R ./build

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ./build/
          
